<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liên hệ - Lê Quốc Thắng</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">LQT.dev</a>
      <ul class="nav-links">
        <li><a href="index.html">Trang chủ</a></li>
        <li><a href="projects.html">Dự án (6)</a></li>
        <li><a href="about.html">Giới thiệu</a></li>
        <li><a href="contact.html" class="active">Liên hệ</a></li>
      </ul>
      <button id="theme-toggle" class="theme-btn" aria-label="Đổi giao diện Sáng/Tối">🌙 Dark</button>
    </div>
  </nav>

  <section class="container contact-section reveal">
    <h1>Liên hệ với mình</h1>
    <p>Gửi tin nhắn trực tiếp qua Formspree bên dưới:</p>

    <form action="https://formspree.io/f/your_form_id" method="POST" class="contact-form">
      <div class="form-group">
        <label for="name">Họ và tên</label>
        <input type="text" id="name" name="name" placeholder="Nhập họ tên của bạn" required>
      </div>
      <div class="form-group">
        <label for="email">Email liên hệ</label>
        <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
      </div>
      <div class="form-group">
        <label for="message">Nội dung lời nhắn</label>
        <textarea id="message" name="message" rows="5" placeholder="Nhập nội dung cần trao đổi..." required></textarea>
      </div>
      <button type="submit" class="btn primary full-width">Gửi tin nhắn</button>
    </form>
  </section>

  <footer>
    <p>© 2026 Lê Quốc Thắng (MSSV: 231A010524) - Khoa CNTT, Đại học Văn Hiến</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
